<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Literature Manager</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1>Literature Manager</h1>
          <p class="muted">Local-first workspace</p>
        </div>

        <div class="sidebar-section">
          <div class="section-title">Storage Root</div>
          <div class="row">
            <input
              id="storageRoot"
              type="text"
              placeholder="D:\\Data\\Literature"
            />
            <button id="saveRoot">Save</button>
          </div>
          <div id="rootStatus" class="status"></div>
        </div>

        <div class="sidebar-section">
          <div class="section-title row space-between">
            <span>Folders</span>
            <button id="refreshFolders" class="ghost">Refresh</button>
          </div>
          <div id="folderTree" class="tree"></div>
        </div>

        <div class="sidebar-section">
          <div class="section-title">Categories</div>
          <div class="row">
            <input
              id="newCategoryInput"
              type="text"
              placeholder="New category"
            />
            <button id="addCategory">Add</button>
          </div>
          <div id="categoryStatus" class="status"></div>
          <div id="categoryList" class="pill-list"></div>
        </div>

        <div class="sidebar-footer">
          <button id="openAiCenter" class="ghost">AI Center</button>
          <button id="openUpload">Add File</button>
        </div>
      </aside>

      <section class="list-pane">
        <div class="list-toolbar">
          <div class="row space-between">
            <div class="row">
              <button id="clearFolder" class="ghost">All folders</button>
              <span id="activeFolderLabel" class="muted">All folders</span>
            </div>
            <button id="refreshList" class="ghost">Refresh</button>
          </div>
          <div class="search-bar">
            <input id="searchInput" type="text" placeholder="Search keywords" />
            <select id="searchCategory">
              <option value="">All categories</option>
            </select>
            <input id="yearStart" type="number" placeholder="Year from" />
            <input id="yearEnd" type="number" placeholder="Year to" />
            <button id="runSearch">Search</button>
          </div>
          <div class="row space-between">
            <div class="row">
              <select id="pageSize">
                <option value="10">10 / page</option>
                <option value="25" selected>25 / page</option>
                <option value="50">50 / page</option>
              </select>
            </div>
            <div class="row">
              <button id="prevPage" class="ghost">Prev</button>
              <span id="pageInfo" class="muted">Page 1</span>
              <button id="nextPage" class="ghost">Next</button>
            </div>
          </div>
        </div>

        <div class="table">
          <div id="listHeader" class="table-head">
            <button class="table-sort" data-sort="title">Title</button>
            <button class="table-sort" data-sort="authors">Authors</button>
            <button class="table-sort" data-sort="year">Year</button>
            <button class="table-sort" data-sort="category">Category</button>
          </div>
          <div id="literatureList" class="table-body"></div>
        </div>
      </section>

      <aside class="detail-pane">
        <div class="detail-header">
          <div>
            <h2>Details</h2>
            <div id="agentMeta" class="muted"></div>
          </div>
          <div class="row">
            <button id="deleteDetail" class="ghost">Delete</button>
            <button id="saveDetail">Save</button>
          </div>
        </div>

        <div class="detail-form">
          <label>
            Title
            <input id="detailTitleInput" type="text" />
          </label>
          <label>
            Authors
            <input id="detailAuthorsInput" type="text" />
          </label>
          <div class="row">
            <label>
              Year
              <input id="detailYearInput" type="number" />
            </label>
            <label>
              Journal
              <input id="detailJournalInput" type="text" />
            </label>
          </div>
          <label>
            Category
            <select id="detailCategorySelect">
              <option value="">No category</option>
            </select>
          </label>
          <label>
            Abstract
            <textarea id="detailAbstractInput" rows="6"></textarea>
          </label>
          <label>
            Citation
            <textarea id="detailCitationInput" rows="3"></textarea>
          </label>
          <label>
            File
            <div id="detailFile" class="detail-box"></div>
          </label>
          <div class="row space-between">
            <button id="agentSuggest" class="ghost" type="button">
              Agent Suggest
            </button>
            <div id="agentStatus" class="status"></div>
          </div>
        </div>
      </aside>
    </div>

    <div id="aiModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-action="close-ai"></div>
      <div class="modal-card" role="dialog" aria-modal="true">
        <div class="row space-between">
          <h2>AI Center</h2>
          <button id="closeAiCenter" class="ghost">Close</button>
        </div>
        <div class="stack">
          <div class="row">
            <select id="agentProvider">
              <option value="disabled">Disabled</option>
              <option value="api">API</option>
            </select>
            <input
              id="agentEndpoint"
              type="text"
              placeholder="https://your-host/your-endpoint"
            />
          </div>
          <div class="row">
            <input id="agentModel" type="text" placeholder="Model name" />
            <input
              id="agentApiKey"
              type="password"
              placeholder="API key (optional)"
            />
          </div>
          <div class="row">
            <input
              id="agentTimeout"
              type="number"
              min="1"
              max="120"
              placeholder="Timeout seconds"
            />
            <button id="saveAgentConfig">Save</button>
          </div>
          <div id="agentConfigStatus" class="status"></div>
          <div class="ai-status">
            <div>
              <h3>API Status</h3>
              <button id="healthCheck" class="ghost">Ping API</button>
            </div>
            <pre id="healthResult"></pre>
          </div>
        </div>
      </div>
    </div>

    <div id="uploadModal" class="modal hidden" aria-hidden="true">
      <div class="modal-backdrop" data-action="close-upload"></div>
      <div class="modal-card" role="dialog" aria-modal="true">
        <div class="row space-between">
          <h2>Upload Literature</h2>
          <button id="closeUpload" class="ghost">Close</button>
        </div>
        <form id="uploadForm" class="stack">
          <div class="row">
            <input id="titleInput" type="text" placeholder="Title" />
            <input id="authorsInput" type="text" placeholder="Authors" />
          </div>
          <div class="row">
            <input id="yearInput" type="number" placeholder="Year" />
            <input id="journalInput" type="text" placeholder="Journal" />
          </div>
          <textarea
            id="abstractInput"
            placeholder="Abstract"
            rows="3"
          ></textarea>
          <textarea
            id="citationInput"
            placeholder="Citation"
            rows="2"
          ></textarea>
          <div class="row">
            <select id="categorySelect">
              <option value="">No category</option>
            </select>
            <input id="subdirInput" type="text" placeholder="Subfolder" />
          </div>
          <div class="row">
            <input id="fileInput" type="file" />
            <button type="submit">Upload</button>
          </div>
          <div class="progress">
            <div id="uploadProgress" class="progress-bar"></div>
          </div>
          <div id="uploadStatus" class="status"></div>
        </form>
      </div>
    </div>

    <div id="toastContainer" class="toast-stack" aria-live="polite"></div>

    <script src="js/app.js"></script>
  </body>
</html>
